name: open chain

# The open chain, end to end, with no GAMS: DD files -> times_pp -> times_eq -> HiGHS on the
# reference cases listed in models/ci_models.txt, each compared with the GAMS result published
# beside it (expected.json, and gams_solution.db3 / gams_matrix.db3 where the case has them).
# A change that stops any case from reproducing its published result goes red.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  example:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        julia: ["1.11", "1"]               # the oldest Julia supported, and the newest stable release
        include:
          - os: ubuntu-latest
            python: "3.11"                 # the oldest Python the chain needs (the regular expressions of gamsdata.py)
            julia: "1.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: julia-actions/setup-julia@v2
        id: julia
        with:
          version: ${{ matrix.julia }}
      # Julia's packages and their compiled code where setup puts them, .julia_depot in the checkout (Julia's default
      # depot, ~/.julia, is not used by times-os). JULIA_DEPOT_PATH is not set for the job: the runs find the depot
      # through settings.json, as a user's do. A depot restored from an older key is brought up to date by setup.
      - uses: actions/cache@v4
        with:
          path: .julia_depot
          key: julia-depot-${{ runner.os }}-${{ steps.julia.outputs.julia-version }}-${{ hashFiles('times_eq/Project.toml', 'times_eq/addons/*/Project.toml', 'times_pp/jlkernels/Project.toml') }}
          restore-keys: julia-depot-${{ runner.os }}-${{ steps.julia.outputs.julia-version }}-
      - name: setup (installs the Python and Julia environments and the TIMES source; no GAMS)
        run: python TIMES.py setup
      - name: the Python tests (the DD reader, the refusals, the runner's safety)
        shell: bash
        run: |
          PY=.venv/bin/python; [ -x "$PY" ] || PY=.venv/Scripts/python.exe
          "$PY" -m pip install pytest
          "$PY" -m pytest -q times_pp/tests
      - name: the reference cases reproduce their GAMS result
        run: python .github/scripts/check_models.py
      - name: a serial, a parallel and a --wait build (a setting given on Julia's input) give the same matrix
        run: python .github/scripts/check_parallel.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.os }}-${{ matrix.python }}-julia${{ matrix.julia }}
          path: runs/ci/*/report_*.*

  # The package as a user installs it (pip install times-os): the wheel built from this tree, installed into a fresh
  # environment, then from an empty folder times-os example and times-os run (the first run sets the package up:
  # Julia installed when none is found, the Julia packages, the compiled workload), compared with DemoS_012's
  # published result (expected.json), a second run, check; and nothing written in the environment's package folder.
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the wheel
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
      - name: install it into a fresh environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/user"
          PY="$RUNNER_TEMP/user/bin/python"; [ -x "$PY" ] || PY="$RUNNER_TEMP/user/Scripts/python.exe"
          "$PY" -m pip install dist/*.whl
          echo "USER_PY=$PY" >> "$GITHUB_ENV"
      - name: example, first run (sets itself up), check, second run
        shell: bash
        run: python .github/scripts/check_package.py "$RUNNER_TEMP/work" --python "$USER_PY" --clean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/work/package_check.json
            ${{ runner.temp }}/work/setup.log
            ${{ runner.temp }}/work/julia_packages.log
            ${{ runner.temp }}/work/times-os-runs/demo/report_*.*
